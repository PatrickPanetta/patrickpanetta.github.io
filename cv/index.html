        /* Basic Reset */
        * {
            margin-block: clamp(16px, 5vw, 64px);
            margin-inline: clamp(16px, 5vw, 64px);
            padding: 10;
            box-sizing: border-box;
        }

        /* Left-justify the content vertically and horizontally */
        body {
            background-color: white;
            height: 100vh;
            display: flex;
            justify-content: left;
            align-items: top;
            font-family: Andale Mono, Courier, "Courier New", monospace;
            overflow: hidden;
        }

        /* Container for the links */
        nav {
            text-align: left;
            /* Adjust width for different screen shapes */
            width: fit-content;
        }

        /* Style the links */
        a, p {
            display: block;
            color: black;
            text-decoration: none;
            font-size: 1rem;
            line-height: 1; /* Vertical spacing between lines */
            transition: opacity 0.2s;
        }

        /* Hover effect */
        a:hover {
            color: blue;
            opacity: 100%;
        }

        /* Mobile specific adjustments (Portrait) */
        @media (max-width: 480px) {
            a, p {
                font-size: 1.2rem;
                line-height: 1.3; /* More space for thumb-tapping on mobile */
            }
        }
    </style>
